<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AnimeNetworkTamil</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <div class="logo">
            AnimeNetworkTamil
        </div>

        <button id="themeToggle" class="theme-button">
            🌙
        </button>

    </header>


    <main>

        <section class="hero">

            <h1>AnimeNetworkTamil</h1>

            <p>
                Tamil Anime • Latest Releases • Movies
            </p>

            <a
                href="https://t.me/AnimeNetworkTamil"
                target="_blank"
                rel="noopener noreferrer"
                class="telegram-button"
            >
                📲 Join Telegram
            </a>

        </section>


        <section class="anime-section">
            <div class="anime-tools">

    <input
        type="search"
        id="animeSearch"
        placeholder="🔎 Search anime..."
        autocomplete="off"
    >

    <div class="genre-buttons">

        <button class="genre-btn active" data-genre="all">
            All
        </button>

        <button class="genre-btn" data-genre="action">
            ⚔️ Action
        </button>

        <button class="genre-btn" data-genre="adventure">
            🌎 Adventure
        </button>

        <button class="genre-btn" data-genre="fantasy">
            ✨ Fantasy
        </button>

    </div>

            </div>

            <div class="section-title">
                <h2>🔥 Latest Anime</h2>
            </div>


            <div class="anime-container">


                <!-- One Piece -->

                <article
    class="anime-card"
    data-title="one piece"
    data-genres="action adventure"
>

                    <img
                        class="anime-image"
                        src="https://image.tmdb.org/t/p/original/uiIB9ctqZFbfRXXimtpmZb5dusi.jpg"
                        alt="One Piece"
                    >

                    <div class="anime-info">

                        <h3>One Piece</h3>

                        <p>⭐ 8.9/10</p>

                        <p>🎙️ Tamil</p>

                        <a
                            href="anime.html?anime=one-piece"
                            class="view-button"
                        >
                            View Anime
                        </a>

                    </div>

                </article>


                <!-- Naruto -->

                <article
    class="anime-card"
    data-title="naruto"
    data-genres="action adventure"
>

                    <img
                        class="anime-image"
                        src="https://image.tmdb.org/t/p/original/xppeysfvDKVx775MFuH8Z9BlpMk.jpg"
                        alt="Naruto"
                    >

                    <div class="anime-info">

                        <h3>Naruto</h3>

                        <p>⭐ 8.7/10</p>

                        <p>🎙️ Tamil</p>

                        <a
                            href="anime.html?anime=naruto"
                            class="view-button"
                        >
                            View Anime
                        </a>

                    </div>

                </article>


                <!-- Jujutsu Kaisen -->

                <article
    class="anime-card"
    data-title="Jujutsu Kaisen"
    data-genres="action adventure"
>

                    <img
                        class="anime-image"
                        src="https://image.tmdb.org/t/p/original/6qQzMJG27XOJsyAEEIisoJB45j2.jpg"
                        alt="Jujutsu Kaisen"
                    >

                    <div class="anime-info">

                        <h3>Jujutsu Kaisen</h3>

                        <p>⭐ 8.6/10</p>

                        <p>🎙️ Tamil</p>

                        <a
                            href="anime.html?anime=Jujutsukaisen"
                            class="view-button"
                        >
                            View Anime
                        </a>

                    </div>

                </article>


            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 AnimeNetworkTamil
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
