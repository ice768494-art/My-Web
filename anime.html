<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Anime | AnimeNetworkTamil</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header class="site-header">

        <div class="logo">
            AnimeNetworkTamil
        </div>

        <button id="themeToggle" class="theme-button">
            🌙
        </button>

    </header>


    <main>

        <section class="anime-details" id="animeDetails">

            <img
                id="animePoster"
                class="details-poster"
                src=""
                alt=""
            >

            <div class="details-content">

                <h1 id="animeTitle">
                    Loading...
                </h1>

                <p id="animeRating"></p>

                <p id="animeAudio"></p>

                <p id="animeDescription"></p>

                <button
                    id="watchButton"
                    class="watch-button"
                >
                    ▶ Watch Now
                </button>

                <br><br>

                <a
                    href="index.html"
                    class="back-button"
                >
                    ← Back
                </a>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
